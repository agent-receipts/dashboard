# Lefthook — pre-commit and commit-msg hooks
# Install: brew install lefthook && lefthook install
# Docs: https://lefthook.dev/configuration/
#
# Glob patterns determine whether a job runs (based on staged files).
# Go checks run on the entire module; shellcheck runs on staged files only.

pre-commit:
  parallel: true
  jobs:
    - name: go-vet
      glob: "**/*.{go,mod,sum}"
      run: go vet ./...

    - name: go-fmt
      glob: "**/*.{go,mod,sum}"
      run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)

    - name: go-test
      glob: "**/*.{go,mod,sum}"
      run: go test ./...

    - name: shellcheck
      glob: "**/*.sh"
      run: if command -v shellcheck >/dev/null 2>&1; then shellcheck {staged_files}; else echo "shellcheck not installed — skipping"; fi

commit-msg:
  commands:
    conventional-commit:
      run: convco check --from-stdin < "{1}"
